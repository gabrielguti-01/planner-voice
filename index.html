<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Planner</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#15181c; --dim:#5d6670; --line:#dcd8cf; --accent:#1f6f5c; --accent-ink:#ffffff; --warn:#a4541a; --bad:#a32828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101418; --card:#191f26; --ink:#eef0f2; --dim:#98a2ad; --line:#2a323c; --accent:#4fbf9f; --accent-ink:#06120e; --warn:#e0a05c; --bad:#f08a8a; } }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 4px 0 12px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); margin:0; }
  .meta { font-size: 13px; color: var(--dim); }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  #say { font-size: 22px; line-height: 1.35; font-weight: 500; white-space: pre-wrap; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button { font: inherit; border-radius: 14px; border:1px solid var(--line); background: var(--card); color: var(--ink); padding: 14px 16px; min-height: 52px; cursor: pointer; flex:1 1 auto; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button.listening { outline: 3px solid var(--warn); }
  button:disabled { opacity:.5; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  ol, ul { margin: 0; padding-left: 20px; }
  li { margin: 4px 0; }
  .warn { color: var(--warn); } .bad { color: var(--bad); }
  input[type=text], input[type=password], textarea { width:100%; font: inherit; padding: 12px; border-radius: 12px; border:1px solid var(--line); background: var(--bg); color: var(--ink); }
  label { display:block; font-size: 14px; color: var(--dim); margin: 10px 0 4px; }
  details summary { cursor:pointer; color: var(--dim); font-size: 14px; padding: 6px 0; }
  #pending code { display:block; background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Planner</h1>
    <span class="meta" id="meta">loading…</span>
  </header>

  <section class="card" aria-live="polite">
    <div id="say">…</div>
  </section>

  <div class="row" style="margin-bottom:12px">
    <button id="talk" class="primary">Hold on… I'll talk</button>
    <button id="speak">Read it to me</button>
  </div>

  <section class="card hidden" id="pending">
    <h2 id="pendingTitle">I heard</h2>
    <div id="heard" class="meta"></div>
    <div id="lines"></div>
    <div class="row" style="margin-top:10px">
      <button id="send" class="primary">Save</button>
      <button id="cancel">Cancel</button>
    </div>
  </section>

  <section class="card">
    <label for="typed" style="margin-top:0">Or type it</label>
    <div class="row">
      <input id="typed" type="text" placeholder="I did the dishes · add call the dentist by Friday" autocomplete="off">
      <button id="typedGo" style="flex:0 0 auto">Go</button>
    </div>
  </section>

  <section class="card hidden" id="attentionCard"><h2 class="bad">Needs your attention</h2><ul id="attention"></ul></section>
  <section class="card"><h2>After that</h2><ol id="after"></ol></section>
  <details class="card"><summary>Still open today</summary><ul id="today"></ul></details>
  <details class="card"><summary>Coming up this week</summary><ul id="week"></ul></details>

  <details class="card" id="settings">
    <summary>Settings</summary>
    <label for="repo">Repository (owner/name)</label>
    <input id="repo" type="text" value="" placeholder="owner/repository" autocomplete="off">
    <label for="token">GitHub access token (stays on this device)</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <p class="meta">Create a fine-grained token on GitHub limited to this one repository, with <b>Contents: read and write</b>. It is stored only in this browser.</p>
    <label><input type="checkbox" id="autosend"> Save automatically when I'm sure what you said</label>
    <label><input type="checkbox" id="autospeak" checked> Read the next step aloud after saving</label>
    <div class="row" style="margin-top:10px"><button id="saveSettings">Save settings</button></div>
  </details>
  <p class="meta" id="status"></p>
</main>

<script src="speech.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { toCommands, parseNext } = PlannerSpeech;
  const MOCK = new URLSearchParams(location.search).has('mock');
  const store = { get: (k, d = '') => { try { return localStorage.getItem('planner.' + k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('planner.' + k, v); } catch {} } };
  let next = null, pendingLines = [], lastSpoken = '';

  // ---------- settings ----------
  $('repo').value = store.get('repo', $('repo').value);
  $('token').value = store.get('token');
  $('autosend').checked = store.get('autosend') === '1';
  $('autospeak').checked = store.get('autospeak', '1') === '1';
  $('saveSettings').onclick = () => {
    store.set('repo', $('repo').value.trim()); store.set('token', $('token').value.trim());
    store.set('autosend', $('autosend').checked ? '1' : '0'); store.set('autospeak', $('autospeak').checked ? '1' : '0');
    $('settings').open = false; refresh();
  };
  const status = (t, cls = '') => { $('status').textContent = t; $('status').className = 'meta ' + cls; };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

  // ---------- GitHub ----------
  const api = (path, opts = {}) => fetch(`https://api.github.com/repos/${store.get('repo', $('repo').value)}/contents/${path}`, {
    ...opts, cache: 'no-store',
    headers: { Authorization: `Bearer ${store.get('token')}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) },
  });
  const b64decode = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), (c) => c.charCodeAt(0)));
  const b64encode = (s) => { let bin = ''; for (const b of new TextEncoder().encode(s)) bin += String.fromCharCode(b); return btoa(bin); };

  const MOCK_NEXT = '# Next step\n\nmade:: 2026-10-01 13:24\nvalid_until:: 2026-10-01 15:39\ntired:: off\n\n## Say this\n\nNext: Water the plants. While you do that, we can talk about the weekend plan.\n\n## After that\n\n1. Do the dishes — unwashed dishes come first (DISHES@2026-09-30)\n2. Eat your first real meal, outside if you can — first meal (MEAL-FIRST@2026-10-01)\n\n## Still open today\n\n- Morning teeth (TEETH-AM@2026-10-01)\n- Dinner (DINNER@2026-10-01)\n\n## Coming up (7 days)\n\n- Fri 10-02: Dentist\n\n## Needs your attention\n\n_Nothing._\n\n## Last saved\n\n_No new reports in this run._\n';
  let mockInbox = [];

  async function getNext() {
    if (MOCK) return MOCK_NEXT;
    const r = await api('state/next.md');
    if (!r.ok) throw new Error(r.status === 401 ? 'The token was refused. Check it in Settings.' : r.status === 404 ? 'Repository or file not found. Check Settings.' : `GitHub answered ${r.status}.`);
    return b64decode((await r.json()).content);
  }
  async function appendInbox(lines) {
    if (MOCK) { mockInbox.push(...lines); return; }
    for (let attempt = 0; attempt < 3; attempt++) {
      const r = await api('state/inbox.md');
      if (!r.ok) throw new Error(`Could not read the inbox (${r.status}).`);
      const j = await r.json();
      const body = b64decode(j.content).replace(/\n*$/, '\n') + lines.map((l) => `- ${l}`).join('\n') + '\n';
      const w = await api('state/inbox.md', { method: 'PUT', body: JSON.stringify({ message: `Inbox: ${lines.join('; ').slice(0, 60)}`, content: b64encode(body), sha: j.sha }) });
      if (w.ok) return;
      if (w.status !== 409) throw new Error(`Could not save (${w.status}).`);
    }
    throw new Error('Could not save: the inbox kept changing. Try again.');
  }

  // ---------- render ----------
  function render() {
    if (!next) return;
    $('say').textContent = next.say || 'Nothing is due right now.';
    const stale = next.validUntil && new Date(next.validUntil.replace(' ', 'T')) < new Date();
    $('meta').textContent = next.made ? `as of ${next.made.slice(11)}${stale ? ' · refreshing soon' : ''}${next.tired ? ' · tired mode' : ''}` : '';
    const fill = (id, arr, empty) => { $(id).innerHTML = ''; for (const t of (arr.length ? arr : [empty])) { const li = document.createElement('li'); li.textContent = t; $(id).appendChild(li); } };
    fill('after', next.after, 'Nothing queued.');
    fill('today', next.today, 'All done.');
    fill('week', next.week, 'Nothing dated.');
    fill('attention', next.attention, '');
    $('attentionCard').classList.toggle('hidden', !next.attention.length);
  }
  async function refresh(speakIfNew = false) {
    if (!MOCK && !store.get('token')) { $('say').textContent = 'Open Settings below and add your GitHub token to connect.'; $('meta').textContent = 'not connected'; $('settings').open = true; return; }
    try {
      const before = next?.made;
      next = parseNext(await getNext());
      render();
      status('');
      if (speakIfNew && next.made !== before && $('autospeak').checked) speak(next.say);
      return next.made !== before;
    } catch (e) { status(e.message, 'bad'); return false; }
  }

  // ---------- voice out ----------
  function speak(text) {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[`*_#]/g, ''));
    u.rate = 1.0; lastSpoken = text;
    speechSynthesis.speak(u);
  }
  $('speak').onclick = () => speak($('say').textContent);

  // ---------- handling what was said ----------
  function handle(text) {
    const r = toCommands(text, today());
    if (!r.commands.length) return act(r.action);
    pendingLines = r.commands;
    $('heard').textContent = `“${text}”`;
    $('pendingTitle').textContent = r.uncertain ? "I'm not sure what that is. Save it as a note?" : 'I\'ll record';
    $('lines').innerHTML = '';
    for (const l of r.commands) { const c = document.createElement('code'); c.textContent = l; $('lines').appendChild(c); }
    $('pending').classList.remove('hidden');
    $('pending').dataset.action = r.action || '';
    if ($('autosend').checked && !r.uncertain) send();
  }
  function act(action) {
    if (action === 'list') { document.querySelectorAll('details')[0].open = true; speak(`Still open today: ${next.today.slice(0, 8).join('. ')}.`); }
    else if (action === 'week') { document.querySelectorAll('details')[1].open = true; speak(next.week.length ? `Coming up: ${next.week.join('. ')}.` : 'Nothing dated this week.'); }
    else refresh().then(() => speak(next?.say));
  }
  async function send() {
    const lines = pendingLines; pendingLines = [];
    $('send').disabled = true;
    try {
      await appendInbox(lines);
      $('pending').classList.add('hidden');
      const made = next?.made;
      // the queue is already computed: give the next step right away, then confirm when the engine has run
      const upNext = next?.after[0];
      status('Saved. The planner is updating…');
      if ($('autospeak').checked) speak(upNext ? `Saved. Next: ${upNext}.` : 'Saved.');
      if (MOCK) return status(`Saved (demo). Inbox: ${mockInbox.join(' | ')}`);
      for (let i = 0; i < 12; i++) { // up to ~2 minutes
        await new Promise((r) => setTimeout(r, 10000));
        const fresh = parseNext(await getNext());
        if (fresh.made !== made) { next = fresh; render(); status('Updated.'); if (next.attention.length && $('autospeak').checked) speak(`One thing needs your attention: ${next.attention[0]}`); return; }
      }
      status('Saved. The planner will catch up on its next run.', 'warn');
    } catch (e) { pendingLines = lines; status(`Not saved: ${e.message}`, 'bad'); if ($('autospeak').checked) speak('Not saved.'); }
    finally { $('send').disabled = false; }
  }
  $('send').onclick = send;
  $('cancel').onclick = () => { pendingLines = []; $('pending').classList.add('hidden'); };
  $('typedGo').onclick = () => { const v = $('typed').value.trim(); if (v) { $('typed').value = ''; handle(v); } };
  $('typed').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('typedGo').click(); });

  // ---------- voice in ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const talk = $('talk');
  if (!SR) { talk.textContent = 'Voice input not supported here'; talk.disabled = true; }
  else {
    talk.textContent = 'Tap and talk';
    const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    let on = false;
    rec.onresult = (e) => handle(e.results[0][0].transcript);
    rec.onerror = (e) => status(e.error === 'not-allowed' ? 'Microphone permission is needed for voice.' : `Voice input stopped (${e.error}).`, 'warn');
    rec.onend = () => { on = false; talk.classList.remove('listening'); talk.textContent = 'Tap and talk'; };
    talk.onclick = () => {
      if (on) return rec.stop();
      speechSynthesis?.cancel();
      try { rec.start(); on = true; talk.classList.add('listening'); talk.textContent = 'Listening… tap to stop'; } catch {}
    };
  }

  refresh();
  setInterval(() => { if (document.visibilityState === 'visible' && !pendingLines.length) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
})();
</script>
</body>
</html>
