<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060914">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<title>Planner</title>
<style>
  :root {
    --bg:#060914; --panel:rgba(14,18,38,.74); --ink:#f3f5ff; --dim:#8b93b8; --line:rgba(255,72,84,.32);
    --cy:#ff3b47; --cy-soft:rgba(255,59,71,.14); --gold:#4da3ff; --bad:#ffb347; --ok:#5dffb0;
    --hot:var(--cy); --spin:1;
    --display:"Orbitron","Rajdhani",system-ui,sans-serif; --body:"Rajdhani",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Share Tech Mono",ui-monospace,Consolas,monospace;
  }
  body[data-state="listening"] { --hot:#7fc0ff; --spin:.28; }
  body[data-state="speaking"]  { --spin:.6; }
  body[data-state="saving"]    { --spin:.4; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:500 18px/1.4 var(--body); -webkit-font-smoothing:antialiased; }
  body {
    background:
      radial-gradient(820px 480px at 50% -6%, rgba(255,59,71,.26), transparent 62%),
      radial-gradient(700px 520px at 50% 108%, rgba(60,120,255,.20), transparent 60%),
      repeating-conic-gradient(from 0deg at 50% 150px, rgba(255,255,255,.035) 0deg .35deg, transparent .35deg 15deg),
      repeating-radial-gradient(circle at 50% 150px, transparent 0 46px, rgba(255,255,255,.03) 46px 47px),
      var(--bg);
    background-attachment: fixed;
  }
  /* scanlines + vignette */
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.028) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.62)); }
  main { position:relative; z-index:1; max-width:560px; margin:0 auto; padding:14px 16px calc(28px + env(safe-area-inset-bottom)); }

  /* ---- top bar ---- */
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; font:500 11px/1 var(--display); letter-spacing:.22em; text-transform:uppercase; color:var(--dim); padding:6px 2px 4px; }
  header b { color:var(--cy); font-weight:700; text-shadow:0 0 12px rgba(255,59,71,.7); }
  .capsule { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--hot); background:rgba(255,59,71,.05); transition:color .3s; }
  .led { width:7px; height:7px; border-radius:50%; background:var(--hot); box-shadow:0 0 10px var(--hot); animation:breathe 2.4s ease-in-out infinite; }
  #clock { font-family:var(--mono); letter-spacing:.08em; font-size:13px; color:var(--ink); }

  /* ---- reactor core ---- */
  .core-wrap { display:grid; place-items:center; margin:6px 0 2px; }
  #core { all:unset; cursor:pointer; position:relative; width:216px; height:216px; display:grid; place-items:center; -webkit-tap-highlight-color:transparent; }
  #core:focus-visible { outline:2px solid var(--gold); outline-offset:6px; border-radius:50%; }
  #core svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 10px color-mix(in srgb, var(--hot) 70%, transparent)); }
  #core .r { fill:none; stroke:var(--hot); transform-origin:108px 108px; transition:stroke .35s; }
  #core .r1 { stroke-width:1.2; stroke-dasharray:2 7; opacity:.75; animation:spin calc(46s * var(--spin)) linear infinite; }
  #core .r2 { stroke:var(--gold); stroke-width:2.2; stroke-dasharray:70 22 18 22; stroke-linecap:round; animation:spin calc(13s * var(--spin)) linear infinite reverse; }
  #core .web { stroke-width:1.1; opacity:.7; stroke-linejoin:round; animation:spin calc(60s * var(--spin)) linear infinite; }
  #core .r4 { stroke-width:4; stroke-dasharray:96 205; stroke-linecap:round; opacity:.95; animation:spin calc(8s * var(--spin)) linear infinite; }

  #core .heart { width:84px; height:84px; border-radius:50%; position:relative; display:grid; place-items:center;
    background:radial-gradient(circle at 50% 42%, #fff 0 5%, color-mix(in srgb, var(--hot) 85%, #fff) 16%, color-mix(in srgb, var(--hot) 45%, transparent) 46%, transparent 70%);
    box-shadow:0 0 34px color-mix(in srgb, var(--hot) 75%, transparent), inset 0 0 22px rgba(255,255,255,.35); animation:pulse calc(3.2s * var(--spin)) ease-in-out infinite; }
  #core .heart span { font:700 10px/1 var(--display); letter-spacing:.24em; color:#fff; text-transform:uppercase; }
  .core-label { margin-top:2px; text-align:center; font:500 10px/1.6 var(--display); letter-spacing:.3em; color:var(--dim); text-transform:uppercase; }
  .core-label b { color:var(--hot); font-weight:700; transition:color .3s; }

  /* ---- panels ---- */
  .card { position:relative; margin:12px 0; padding:16px 16px 15px; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(6px);
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); box-shadow:inset 0 0 26px rgba(255,59,71,.06); }
  .card::before, .card::after { content:""; position:absolute; width:22px; height:22px; pointer-events:none; }
  .card::before { top:6px; right:6px; border-top:2px solid var(--cy); border-right:2px solid var(--cy); opacity:.9; }
  .card::after { bottom:6px; left:6px; border-bottom:2px solid var(--cy); border-left:2px solid var(--cy); opacity:.9; }
  h2, summary, label, .tag { font:500 10.5px/1.3 var(--display); letter-spacing:.24em; text-transform:uppercase; color:var(--cy); margin:0 0 9px; }
  h2::before, summary::before { content:"// "; color:var(--dim); }
  #say { font:600 23px/1.28 var(--body); color:#ffffff; text-shadow:0 0 18px rgba(255,59,71,.35); white-space:pre-wrap; animation:reveal .55s ease-out both; }
  .primary-panel { border-color:rgba(255,59,71,.55); }
  .meta { font:400 13px/1.4 var(--mono); color:var(--dim); letter-spacing:.02em; }
  ol, ul { margin:0; padding-left:0; list-style:none; counter-reset:n; }
  li { position:relative; margin:0; padding:8px 0 8px 34px; border-top:1px dashed rgba(255,59,71,.16); font-size:17.5px; }
  li:first-child { border-top:0; }
  ol li::before { counter-increment:n; content:counter(n, decimal-leading-zero); position:absolute; left:0; top:10px; font:400 12px/1 var(--mono); color:var(--cy); }
  ul li::before { content:""; position:absolute; left:6px; top:17px; width:8px; height:2px; background:var(--cy); box-shadow:0 0 8px var(--cy); }

  /* ---- controls ---- */
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button { font:700 12px/1 var(--display); letter-spacing:.18em; text-transform:uppercase; color:var(--cy); background:rgba(255,59,71,.06); border:1px solid var(--line);
    padding:15px 14px; min-height:50px; cursor:pointer; flex:1 1 auto; clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition:background .2s, box-shadow .2s, color .2s; }
  button:hover { background:rgba(255,59,71,.14); }
  button:active { transform:translateY(1px); }
  button.primary { background:linear-gradient(180deg, rgba(255,59,71,.95), rgba(196,24,40,.95)); color:#fff; border-color:transparent; box-shadow:0 0 22px rgba(255,59,71,.45); }
  button.listening { background:linear-gradient(180deg, #9cc9ff, var(--gold)); color:#02101f; box-shadow:0 0 26px rgba(77,163,255,.6); }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  input[type=text], input[type=password] { width:100%; min-width:0; flex:1 1 180px; font:500 17px/1.2 var(--body); color:var(--ink); background:rgba(2,10,16,.75); border:1px solid var(--line); padding:13px 12px; border-radius:0; caret-color:var(--gold); }
  input::placeholder { color:#6b7299; }
  label { display:block; margin:14px 0 6px; }
  label.check { display:flex; gap:10px; align-items:center; font:500 16px/1.3 var(--body); letter-spacing:0; text-transform:none; color:var(--ink); }
  input[type=checkbox] { width:20px; height:20px; accent-color:var(--cy); }
  details summary { cursor:pointer; margin:0; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  details summary::-webkit-details-marker { display:none; }
  details summary::after { content:"+"; font:400 18px/1 var(--mono); color:var(--cy); }
  details[open] summary::after { content:"–"; }
  details[open] summary { margin-bottom:10px; }
  #pending { border-color:rgba(77,163,255,.6); }
  #pending::before, #pending::after { border-color:var(--gold); }
  #pending h2 { color:var(--gold); }
  #lines code { display:block; font:400 15px/1.4 var(--mono); color:var(--gold); background:rgba(77,163,255,.07); border-left:2px solid var(--gold); padding:9px 11px; margin:7px 0; white-space:pre-wrap; word-break:break-word; }
  #attentionCard { border-color:rgba(255,107,107,.6); } #attentionCard h2 { color:var(--bad); }
  #status { text-align:center; min-height:20px; margin:14px 0 0; }
  .warn { color:var(--gold); } .bad { color:var(--bad); }
  .hidden { display:none; }
  p.meta { margin:10px 0 0; }

  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform:scale(.94); opacity:.86; } 50% { transform:scale(1.04); opacity:1; } }
  @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:1; } }
  @keyframes reveal { from { opacity:0; transform:translateY(6px); filter:blur(3px); } to { opacity:1; transform:none; filter:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body data-state="idle">
<main>
  <header>
    <span><b>Planner</b> · v1</span>
    <span class="capsule"><i class="led"></i><span id="mode">ONLINE</span></span>
    <span id="clock">--:--</span>
  </header>

  <div class="core-wrap">
    <button id="core" aria-label="Tap to talk">
      <svg viewBox="0 0 216 216" aria-hidden="true">
        <circle class="r r1" cx="108" cy="108" r="104"/>
        <g class="r web">
          <path d="M108 6V210M6 108H210M35.9 35.9L180.1 180.1M180.1 35.9L35.9 180.1"/>
          <path d="M108 16L173 43L200 108L173 173L108 200L43 173L16 108L43 43Z"/>
          <path d="M108 40L156 60L176 108L156 156L108 176L60 156L40 108L60 60Z"/>
          <path d="M108 62L140.5 75.5L154 108L140.5 140.5L108 154L75.5 140.5L62 108L75.5 75.5Z"/>
        </g>
        <circle class="r r4" cx="108" cy="108" r="96"/>
        <circle class="r r2" cx="108" cy="108" r="58"/>
      </svg>
      <div class="heart"><span>Talk</span></div>
    </button>
    <div class="core-label"><b id="meta">loading…</b></div>
  </div>

  <section class="card primary-panel" aria-live="polite">
    <h2>Next action</h2>
    <div id="say">…</div>
  </section>

  <div class="row">
    <button id="talk" class="primary">Tap and talk</button>
    <button id="speak">Read it to me</button>
  </div>

  <section class="card hidden" id="pending">
    <h2 id="pendingTitle">I heard</h2>
    <div id="heard" class="meta"></div>
    <div id="lines"></div>
    <div class="row" style="margin-top:10px">
      <button id="send" class="primary">Save</button>
      <button id="cancel">Cancel</button>
    </div>
  </section>

  <section class="card">
    <label for="typed" style="margin-top:0">Manual input</label>
    <div class="row">
      <input id="typed" type="text" placeholder="I did the dishes · add call the dentist by Friday" autocomplete="off">
      <button id="typedGo" style="flex:0 0 auto">Send</button>
    </div>
  </section>

  <section class="card hidden" id="attentionCard"><h2>Alert</h2><ul id="attention"></ul></section>
  <section class="card"><h2>Queue</h2><ol id="after"></ol></section>
  <details class="card"><summary>Still open today</summary><ul id="today"></ul></details>
  <details class="card"><summary>Coming up this week</summary><ul id="week"></ul></details>

  <details class="card" id="settings">
    <summary>System</summary>
    <label for="repo">Repository (owner/name)</label>
    <input id="repo" type="text" value="" placeholder="owner/repository" autocomplete="off">
    <label for="token">GitHub access token (stays on this device)</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <p class="meta">Create a fine-grained token on GitHub limited to this one repository, with Contents: read and write. It is stored only in this browser.</p>
    <label class="check"><input type="checkbox" id="autosend"> Save automatically when I'm sure what you said</label>
    <label class="check"><input type="checkbox" id="autospeak" checked> Read the next step aloud after saving</label>
    <div class="row" style="margin-top:14px"><button id="saveSettings">Save settings</button></div>
  </details>
  <p class="meta" id="status"></p>
</main>

<script src="speech.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { toCommands, parseNext } = PlannerSpeech;
  const MOCK = new URLSearchParams(location.search).has('mock');
  const store = { get: (k, d = '') => { try { return localStorage.getItem('planner.' + k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('planner.' + k, v); } catch {} } };
  let next = null, pendingLines = [], lastSpoken = '';
  const MODES = { idle: 'ONLINE', listening: 'LISTENING', speaking: 'SPEAKING', saving: 'SYNCING' };
  const setState = (s) => { if (document.body) document.body.dataset.state = s; $('mode').textContent = MODES[s]; };
  const tickClock = () => { const d = new Date(); $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  tickClock(); setInterval(tickClock, 15000);

  // ---------- settings ----------
  $('repo').value = store.get('repo', $('repo').value);
  $('token').value = store.get('token');
  $('autosend').checked = store.get('autosend') === '1';
  $('autospeak').checked = store.get('autospeak', '1') === '1';
  $('saveSettings').onclick = () => {
    store.set('repo', $('repo').value.trim()); store.set('token', $('token').value.trim());
    store.set('autosend', $('autosend').checked ? '1' : '0'); store.set('autospeak', $('autospeak').checked ? '1' : '0');
    $('settings').open = false; refresh();
  };
  const status = (t, cls = '') => { $('status').textContent = t; $('status').className = 'meta ' + cls; };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

  // ---------- GitHub ----------
  const api = (path, opts = {}) => fetch(`https://api.github.com/repos/${store.get('repo', $('repo').value)}/contents/${path}`, {
    ...opts, cache: 'no-store',
    headers: { Authorization: `Bearer ${store.get('token')}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) },
  });
  const b64decode = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), (c) => c.charCodeAt(0)));
  const b64encode = (s) => { let bin = ''; for (const b of new TextEncoder().encode(s)) bin += String.fromCharCode(b); return btoa(bin); };

  const MOCK_NEXT = '# Next step\n\nmade:: 2026-10-01 13:24\nvalid_until:: 2026-10-01 15:39\ntired:: off\n\n## Say this\n\nNext: Water the plants. While you do that, we can talk about the weekend plan.\n\n## After that\n\n1. Do the dishes — unwashed dishes come first (DISHES@2026-09-30)\n2. Eat your first real meal, outside if you can — first meal (MEAL-FIRST@2026-10-01)\n\n## Still open today\n\n- Morning teeth (TEETH-AM@2026-10-01)\n- Dinner (DINNER@2026-10-01)\n\n## Coming up (7 days)\n\n- Fri 10-02: Dentist\n\n## Needs your attention\n\n_Nothing._\n\n## Last saved\n\n_No new reports in this run._\n';
  let mockInbox = [];

  async function getNext() {
    if (MOCK) return MOCK_NEXT;
    const r = await api('state/next.md');
    if (!r.ok) throw new Error(r.status === 401 ? 'The token was refused. Check it in Settings.' : r.status === 404 ? 'Repository or file not found. Check Settings.' : `GitHub answered ${r.status}.`);
    return b64decode((await r.json()).content);
  }
  async function appendInbox(lines) {
    if (MOCK) { mockInbox.push(...lines); return; }
    for (let attempt = 0; attempt < 3; attempt++) {
      const r = await api('state/inbox.md');
      if (!r.ok) throw new Error(`Could not read the inbox (${r.status}).`);
      const j = await r.json();
      const body = b64decode(j.content).replace(/\n*$/, '\n') + lines.map((l) => `- ${l}`).join('\n') + '\n';
      const w = await api('state/inbox.md', { method: 'PUT', body: JSON.stringify({ message: `Inbox: ${lines.join('; ').slice(0, 60)}`, content: b64encode(body), sha: j.sha }) });
      if (w.ok) return;
      if (w.status !== 409) throw new Error(`Could not save (${w.status}).`);
    }
    throw new Error('Could not save: the inbox kept changing. Try again.');
  }

  // ---------- render ----------
  function render() {
    if (!next) return;
    $('say').textContent = next.say || 'Nothing is due right now.';
    const stale = next.validUntil && new Date(next.validUntil.replace(' ', 'T')) < new Date();
    $('meta').textContent = next.made ? `as of ${next.made.slice(11)}${stale ? ' · refreshing soon' : ''}${next.tired ? ' · tired mode' : ''}` : '';
    const fill = (id, arr, empty) => { $(id).innerHTML = ''; for (const t of (arr.length ? arr : [empty])) { const li = document.createElement('li'); li.textContent = t; $(id).appendChild(li); } };
    fill('after', next.after, 'Nothing queued.');
    fill('today', next.today, 'All done.');
    fill('week', next.week, 'Nothing dated.');
    fill('attention', next.attention, '');
    $('attentionCard').classList.toggle('hidden', !next.attention.length);
  }
  async function refresh(speakIfNew = false) {
    if (!MOCK && !store.get('token')) { $('say').textContent = 'Open Settings below and add your GitHub token to connect.'; $('meta').textContent = 'not connected'; $('settings').open = true; return; }
    try {
      const before = next?.made;
      next = parseNext(await getNext());
      render();
      status('');
      if (speakIfNew && next.made !== before && $('autospeak').checked) speak(next.say);
      return next.made !== before;
    } catch (e) { status(e.message, 'bad'); return false; }
  }

  // ---------- voice out ----------
  function speak(text) {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[`*_#]/g, ''));
    u.rate = 1.0; lastSpoken = text;
    u.onstart = () => setState('speaking'); u.onend = u.onerror = () => setState('idle');
    speechSynthesis.speak(u);
  }
  $('speak').onclick = () => speak($('say').textContent);

  // ---------- handling what was said ----------
  function handle(text) {
    const r = toCommands(text, today());
    if (!r.commands.length) return act(r.action);
    pendingLines = r.commands;
    $('heard').textContent = `“${text}”`;
    $('pendingTitle').textContent = r.uncertain ? "I'm not sure what that is. Save it as a note?" : 'I\'ll record';
    $('lines').innerHTML = '';
    for (const l of r.commands) { const c = document.createElement('code'); c.textContent = l; $('lines').appendChild(c); }
    $('pending').classList.remove('hidden');
    $('pending').dataset.action = r.action || '';
    if ($('autosend').checked && !r.uncertain) send();
  }
  function act(action) {
    if (action === 'list') { document.querySelectorAll('details')[0].open = true; speak(`Still open today: ${next.today.slice(0, 8).join('. ')}.`); }
    else if (action === 'week') { document.querySelectorAll('details')[1].open = true; speak(next.week.length ? `Coming up: ${next.week.join('. ')}.` : 'Nothing dated this week.'); }
    else refresh().then(() => speak(next?.say));
  }
  async function send() {
    const lines = pendingLines; pendingLines = [];
    $('send').disabled = true;
    setState('saving');
    try {
      await appendInbox(lines);
      setState('idle');
      $('pending').classList.add('hidden');
      const made = next?.made;
      // the queue is already computed: give the next step right away, then confirm when the engine has run
      const upNext = next?.after[0];
      status('Saved. The planner is updating…');
      if ($('autospeak').checked) speak(upNext ? `Saved. Next: ${upNext}.` : 'Saved.');
      if (MOCK) return status(`Saved (demo). Inbox: ${mockInbox.join(' | ')}`);
      for (let i = 0; i < 12; i++) { // up to ~2 minutes
        await new Promise((r) => setTimeout(r, 10000));
        const fresh = parseNext(await getNext());
        if (fresh.made !== made) { next = fresh; render(); status('Updated.'); if (next.attention.length && $('autospeak').checked) speak(`One thing needs your attention: ${next.attention[0]}`); return; }
      }
      status('Saved. The planner will catch up on its next run.', 'warn');
    } catch (e) { setState('idle'); pendingLines = lines; status(`Not saved: ${e.message}`, 'bad'); if ($('autospeak').checked) speak('Not saved.'); }
    finally { $('send').disabled = false; }
  }
  $('send').onclick = send;
  $('cancel').onclick = () => { pendingLines = []; $('pending').classList.add('hidden'); };
  $('typedGo').onclick = () => { const v = $('typed').value.trim(); if (v) { $('typed').value = ''; handle(v); } };
  $('typed').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('typedGo').click(); });

  // ---------- voice in ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const talk = $('talk');
  if (!SR) { talk.textContent = 'Voice input not supported here'; talk.disabled = true; }
  else {
    talk.textContent = 'Tap and talk';
    const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    let on = false;
    rec.onresult = (e) => handle(e.results[0][0].transcript);
    rec.onerror = (e) => status(e.error === 'not-allowed' ? 'Microphone permission is needed for voice.' : `Voice input stopped (${e.error}).`, 'warn');
    rec.onend = () => { on = false; setState('idle'); talk.classList.remove('listening'); talk.textContent = 'Tap and talk'; };
    talk.onclick = () => {
      if (on) return rec.stop();
      speechSynthesis?.cancel();
      try { rec.start(); on = true; setState('listening'); talk.classList.add('listening'); talk.textContent = 'Listening… tap to stop'; } catch {}
    };
  }

  $('core').onclick = () => { if (talk.onclick && !talk.disabled) talk.onclick(); else if ($('typed').focus) $('typed').focus(); };

  refresh();
  setInterval(() => { if (document.visibilityState === 'visible' && !pendingLines.length) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
})();
</script>
</body>
</html>
